name: Android APK

on:
  push:
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key (optional)
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            echo "SIGNING_STORE_FILE=release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: wifi-presence-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
